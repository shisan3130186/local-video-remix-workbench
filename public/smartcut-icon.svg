<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">智剪 SmartCut 应用图标</title>
  <desc id="desc">深蓝圆角方形中，以蓝青渐变的智字和切割缺口组成的视频剪辑标志</desc>
  <defs>
    <linearGradient id="bg" x1="110" y1="90" x2="914" y2="934" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102D4B"/>
      <stop offset=".5" stop-color="#071A30"/>
      <stop offset="1" stop-color="#061426"/>
    </linearGradient>
    <linearGradient id="mark" x1="286" y1="282" x2="754" y2="752" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3E86FF"/>
      <stop offset=".52" stop-color="#27BDF2"/>
      <stop offset="1" stop-color="#5BE3DC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(512 490) rotate(90) scale(420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#168CD1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#168CD1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="190" y="170" width="650" height="690" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020A13" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect x="28" y="28" width="968" height="968" rx="220" fill="url(#bg)"/>
  <rect x="29" y="29" width="966" height="966" rx="219" fill="none" stroke="#2D5473" stroke-opacity=".58" stroke-width="2"/>
  <circle cx="512" cy="490" r="420" fill="url(#glow)"/>
  <g opacity=".34" fill="#7CC7EC">
    <rect x="142" y="312" width="18" height="48" rx="5" transform="rotate(-24 142 312)"/>
    <rect x="176" y="291" width="18" height="48" rx="5" transform="rotate(-20 176 291)"/>
    <rect x="844" y="656" width="18" height="48" rx="5" transform="rotate(22 844 656)"/>
    <rect x="875" y="627" width="18" height="48" rx="5" transform="rotate(26 875 627)"/>
  </g>
  <g filter="url(#shadow)">
    <text x="512" y="626" text-anchor="middle" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="460" font-weight="750" letter-spacing="-32" fill="url(#mark)">智</text>
  </g>
  <path d="M630 690 785 600" stroke="#08192B" stroke-width="48" stroke-linecap="round"/>
  <path d="M625 675 777 587" stroke="url(#mark)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="619" cy="681" r="26" fill="#091A2D" stroke="#45D2E6" stroke-width="14"/>
  <circle cx="671" cy="714" r="26" fill="#091A2D" stroke="#45D2E6" stroke-width="14"/>
  <path d="m693 705 99 49-122-14" fill="url(#mark)"/>
</svg>
