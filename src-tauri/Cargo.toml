[package]
name = "local-video-remix-workbench"
version = "0.4.1"
description = "智剪 SmartCut 本地AI视频工作台"
authors = ["shisan3130186"]
edition = "2021"

[lib]
name = "local_video_remix_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
webpki-root-certs = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
